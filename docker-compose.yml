services:
  omnirush2api:
    build: .
    image: omnirush2api:latest
    container_name: omnirush2api
    restart: unless-stopped
    ports:
      # Both sides follow ${PORT} so the mapping matches what the daemon binds.
      - "${PORT:-20129}:${PORT:-20129}"
    environment:
      # Bearer key clients must send to the local daemon.
      API_KEY: "${API_KEY:-sk-omnirush}"
      # Upstream OmniRush gateway.
      OMNIRUSH_GATEWAY_URL: "${OMNIRUSH_GATEWAY_URL:-https://omnirush.ai/omnirush/v1}"
      # OAuth token pair: "<refresh_token>|<access_token>".
      # Get one with:  node dist/cli.js login
      # Leave it empty to use the token file in the mounted volume instead.
      OMNIRUSH_REFRESH_TOKEN: "${OMNIRUSH_REFRESH_TOKEN:-}"
      PORT: "${PORT:-20129}"
      HOST: "${HOST:-0.0.0.0}"
    volumes:
      # Rotated refresh tokens are persisted here; keep the volume so the
      # account survives a container replacement.
      - omnirush-tokens:/root/.omnirush2api
    healthcheck:
      # /health answers 401 when API_KEY is set, so the check sends it.
      # The probe port follows PORT so it matches what the daemon binds.
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.PORT||20129;fetch('http://127.0.0.1:'+p+'/health',{headers:{authorization:'Bearer '+(process.env.API_KEY||'')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  omnirush-tokens:
